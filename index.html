<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b40"><title>ハタシ利益逆算システム</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#172b3b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:840px;margin:0 auto;padding:22px 16px 48px}header{background:#142b40;color:white;padding:24px 18px;border-radius:18px;margin-bottom:16px}h1{font-size:clamp(23px,4vw,32px);margin:0 0 7px}header p{margin:0;color:#c8d7e4;font-size:14px}.panel{background:white;border:1px solid #e0e7ee;border-radius:18px;padding:20px;box-shadow:0 3px 16px #142b4008}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:14px;font-weight:700;margin:0 0 7px}input,select{width:100%;border:1px solid #bbc9d6;background:#fff;border-radius:11px;padding:14px 12px;font-size:17px;color:#172b3b}input:focus,select:focus{outline:3px solid #b6dafa;border-color:#267ac0}.hint{font-size:12px;color:#62758a;margin-top:6px;min-height:16px}.result{margin-top:18px;background:#edf6fc;border:1px solid #cde4f4;border-radius:16px;padding:20px}.result .label{font-size:14px;font-weight:700}.big{font-size:clamp(36px,7vw,56px);font-weight:800;letter-spacing:-1.5px;color:#08734d;margin:8px 0}.big.error{color:#b23636;font-size:30px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.stat{background:#fff;border-radius:12px;padding:12px}.stat small{display:block;color:#607389;font-size:12px;margin-bottom:5px}.stat strong{font-size:18px;overflow-wrap:anywhere}.notice{font-size:12px;color:#607389;line-height:1.7;margin-top:14px}.foot{font-size:12px;color:#607389;line-height:1.7;padding:14px 3px}.pill{display:inline-block;background:#dff2e8;color:#0b6a43;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:10px}@media(max-width:600px){.wrap{padding:12px 10px 30px}header{padding:20px 16px}.panel{padding:15px}.fields{grid-template-columns:1fr;gap:14px}.stats{grid-template-columns:1fr 1fr;gap:8px}.stat strong{font-size:16px}}
</style></head><body><main class="wrap"><header><h1>ハタシ利益逆算システム</h1><p>希望利益から、入札できる上限金額を自動計算</p></header><section class="panel"><div class="pill">Ver.1｜計算専用・履歴保存なし</div><div class="fields"><div><label for="sellMarket">① 売る市場</label><select id="sellMarket"></select><div class="hint">市場別の売却手取り計算を自動適用</div></div><div><label for="sale">② 販売予定金額（円）</label><input id="sale" type="number" min="0" step="1" value="50000" inputmode="numeric"></div><div><label for="target">③ 抜きたい利益（円）</label><input id="target" type="number" min="0" step="1" value="5000" inputmode="numeric"></div><div><label for="buyMarket">④ 買う市場</label><select id="buyMarket"></select><div id="unit" class="hint"></div></div></div><div class="result" aria-live="polite"><div class="label">最大入札金額</div><div id="bid" class="big">—</div><div class="stats"><div class="stat"><small>売却手取り</small><strong id="net">—</strong></div><div class="stat"><small>手数料込み仕入総額</small><strong id="total">—</strong></div><div class="stat"><small>実際の予想利益</small><strong id="profit">—</strong></div><div class="stat"><small>入札単位</small><strong id="step">—</strong></div></div><div id="message" class="notice"></div></div></section><div class="foot">※各市場の手数料はご提供の計算式に基づきます。消費税10%を含む買付総額を計算します。端数処理が市場の精算規則と異なる場合があります。送料・運賃など未登録の費用は含みません。金額帯の境界では計算結果が変わる場合があります。</div></main><script>
'use strict';
const sales=[['yba','YBAオークション'],['aucnet','オークネット'],['ecook','エコオク'],['ecotre','エコトレ'],['star','スターバイヤーズ'],['kome','コメ兵オークション'],['penguin','ペンギンオークション'],['retail','小売り']];
const buys=[['ybaBox','YBA箱山',100],['ybaEarly','YBA前期',100],['ybaLate','YBA後期',100],['ybaOsakaBid','YBA大阪（入札）',100],['ybaOsakaLive','YBA大阪（手競り）',1000],['ecook','エコオク',1000],['ecotre','エコトレ',100],['starApparel','スターバイヤーズ（アパレル）',1000],['starBag','スターバイヤーズ（バッグ・ジュエリー）',1000],['jds','JDSオークション',1000],['mekiki','メキキオークション',500],['aucnet','オークネット',1000],['kome','コメ兵オークション',1000],['penguin','ペンギンオークション',1000],['jba','JBAオークション',1000]];
const $=id=>document.getElementById(id), yen=n=>Number.isFinite(n)?new Intl.NumberFormat('ja-JP',{maximumFractionDigits:2}).format(n)+'円':'—';
for(const [id,name] of sales){const o=document.createElement('option');o.value=id;o.textContent=name;$('sellMarket').append(o)}
for(const [id,name] of buys){const o=document.createElement('option');o.value=id;o.textContent=name;$('buyMarket').append(o)}
$('sellMarket').value='retail';$('buyMarket').value='ybaBox';
function netSale(x,id){switch(id){case'yba':return x*.88*1.1;case'aucnet':return (x<=12500?x-770:x*.97)*1.1-330;case'ecook':return x*1.1-(x<=10000?990:x<50000?1540:2640);case'ecotre':return x*.9*1.1-440;case'star':return x*1.1-1100;case'kome':return x*.95*1.1;case'penguin':return x*1.02*1.1;case'retail':return x*.9;default:return NaN}}
function purchaseTotal(x,id){let rate;switch(id){case'ybaBox':rate=x<10000?.13:x<20000?.08:.03;return x*1.1+x*rate*1.1;case'ybaEarly':case'ybaLate':case'ybaOsakaBid':case'ybaOsakaLive':rate=x<10000?.15:x<20000?.10:.05;return x*1.1+x*rate*1.1;case'ecook':return x*1.1+(x<10000?500:x<50000?1000:x<100000?2000:x<500000?4000:x<1000000?8000:10000)*1.1;case'ecotre':case'starApparel':return x*1.1+x*.10*1.1;case'starBag':case'penguin':return x*1.1+x*.05*1.1;case'jds':return x*1.1+x*.11;case'mekiki':return x*1.1+x*.03*1.1;case'aucnet':return x*1.1+(x<12500?500:x*.04)*1.1;case'kome':rate=x<10000?.15:x<20000?.10:.05;return x*1.1+x*rate*1.1;case'jba':return x<=10000?x*1.1+500:x<100000?x*1.155:x*1.125;default:return NaN}}
// Enumerate only tier boundaries and binary-search each monotone tier.
const thresholds={ybaBox:[10000,20000],ybaEarly:[10000,20000],ybaLate:[10000,20000],ybaOsakaBid:[10000,20000],ybaOsakaLive:[10000,20000],ecook:[10000,50000,100000,500000,1000000],aucnet:[12500],kome:[10000,20000],jba:[11000,100000]};
function bestBid(limit,id,unit){if(!Number.isFinite(limit)||limit<0)return null;const cap=Math.min(Math.ceil(Math.max(0,limit)/1.1+1000000),100000000000);const boundaries=[0,...(thresholds[id]||[]),cap+unit].sort((a,b)=>a-b);let best=null;for(let i=0;i<boundaries.length-1;i++){const lo=Math.ceil(boundaries[i]/unit),hi=Math.floor((boundaries[i+1]-1)/unit);if(lo>hi)continue;let left=lo,right=hi,found=null;while(left<=right){const mid=Math.floor((left+right)/2),bid=mid*unit;if(purchaseTotal(bid,id)<=limit+1e-7){found=bid;left=mid+1}else right=mid-1}if(found!==null&&(best===null||found>best))best=found}return best}
function render(){const sale=Number($('sale').value),target=Number($('target').value),buyId=$('buyMarket').value,sellId=$('sellMarket').value,unit=buys.find(x=>x[0]===buyId)[2];$('unit').textContent='入札単位：'+yen(unit);$('step').textContent=yen(unit);const invalid=[$('sale').value,$('target').value].some(x=>x.trim()==='')||![sale,target].every(Number.isFinite)||sale<0||target<0;const net=invalid?NaN:netSale(sale,sellId);const limit=net-target;const bid=invalid?null:bestBid(limit,buyId,unit);$('net').textContent=yen(net);$('bid').className='big'+(bid===null?' error':'');$('bid').textContent=bid===null?'入札可能額なし':yen(bid);$('total').textContent=bid===null?'—':yen(purchaseTotal(bid,buyId));$('profit').textContent=bid===null?'—':yen(net-purchaseTotal(bid,buyId));$('message').textContent=invalid?'販売予定金額と希望利益を0円以上で入力してください。':bid===null?'指定の希望利益を確保できる入札金額がありません。':'希望利益を下回らない範囲で、入札単位に合わせた最大額を表示しています。'}
for(const id of ['sellMarket','buyMarket','sale','target'])$(id).addEventListener('input',render);render();
</script></body></html>
